[project]
name = "clicktrader"
version = "0.1.0"
description = "Record-first measurement and bounded automation for digit contracts on synthetic indices"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.45"]

[project.scripts]
clicktrader = "clicktrader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
