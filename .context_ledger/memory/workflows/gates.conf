# Gate command registry (project-owned; copy/update after bootstrap)
#
# Commands are executed from the project repository root by
# .context_ledger/core/bin/ledger-gates. Keep secrets out of this file.
#
# mode=hybrid means explicit commands below run first; when a gate has no
# explicit project commands, the helper discovers conventional package.json
# scripts or Python checks. Set mode=explicit to fail when a gate has no
# configured project command.
mode=hybrid

# One command per line: <gate>|<command>
# Gates: checkpoint, pre-commit, integration, exit
# Examples (uncomment and adapt to this project):
# pre-commit|npm run typecheck
# pre-commit|npm run lint
# pre-commit|npm test
# integration|npm run build
# exit|npm run test

pre-commit|if [ -x .venv/bin/python ]; then .venv/bin/python -m pytest -q; elif [ -x .venv/Scripts/python.exe ]; then .venv/Scripts/python.exe -m pytest -q; else echo "gates.conf: no project venv — refusing to test against system python. Create it: uv venv --python 3.12 .venv && uv pip install -e '.[dev]' --python .venv/bin/python (POSIX) or .venv/Scripts/python.exe (Windows)" >&2; exit 1; fi
exit|if [ -x .venv/bin/python ]; then .venv/bin/python -m pytest -q; elif [ -x .venv/Scripts/python.exe ]; then .venv/Scripts/python.exe -m pytest -q; else echo "gates.conf: no project venv — refusing to test against system python. Create it: uv venv --python 3.12 .venv && uv pip install -e '.[dev]' --python .venv/bin/python (POSIX) or .venv/Scripts/python.exe (Windows)" >&2; exit 1; fi

# Why the interpreter is discovered but never substituted: the two machines
# that work this repo disagree about where "python" lives — bao's Mac has the
# venv at .venv/bin/python and no bare `python`, Tison's Windows checkout puts
# a venv at .venv/Scripts/python.exe and has a system python 3.14 on PATH. So
# the path must be found at run time (commands here run through `sh`), but a
# missing venv must FAIL this gate, not quietly fall back to the system
# interpreter: pytest from a user-site against an unpinned Python proves
# nothing about the pinned environment the tests are meant to hold to, and a
# green gate that means "some python ran something" is worse than a red one.
# To make the gate green, create the venv — not the other way round.
